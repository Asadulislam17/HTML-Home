    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <style>
        /* CSS */
        .hover-card {

        border-color: #0d6efd !important;
        }

    </style>
</head>
<body>

    <div class="container mt-4">
  <div class="row">
    <!-- কার্ড ১ -->

          <p class="card-text">ছবির সংক্ষিপ্ত বর্ণনা এখানে দিন।</p>
        </div>
      </div>

    <!-- কার্ড ২ -->

    <!-- কার্ড ৩ -->

</div>
