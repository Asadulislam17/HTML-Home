<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1 class="text-center">Bootstrap Table</h1>
    <Table class="table table-success table-striped table-bordered mt-3">
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>01</td>
                <td>Asadul Islam</td>
                <td>01703441755</td>
                <td>
                    <button type="button" class="btn btn-outline-primary" data-bs-toggle="tooltip"
                        data-bs-placement="top" title="Edit"><img src="icons/pencil.svg" width="20"
                            height="20"></button>
                    <button type="button" class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#myModal" data-bs-toggle="tooltip"
                        data-bs-placement="top" title="Delete">
                        <img src="icons/trash3.svg" width="20" height="20">
                    </button>
                    <button type="button" class="btn btn-outline-info" data-bs-toggle="tooltip" data-bs-placement="top"
                        title="View"><img src="icons/eye.svg" width="20" height="20"></button>
                </td>
            </tr>
            <tr>
                <td>02</td>
                <td>Rafi Islam</td>
                <td>01703425486</td>
                <td>
                    <button type="button" class="btn btn-outline-primary" data-bs-toggle="tooltip"
                        data-bs-placement="top" title="Edit"><img src="icons/pencil.svg" width="20"
                            height="20"></button>
                    <button type="button" class="btn btn-outline-danger" data-bs-toggle="tooltip"
                        data-bs-placement="top" title="Delete">
                        <img src="icons/trash3.svg" width="20" height="20">
                    </button>
                    <button type="button" class="btn btn-outline-info" data-bs-toggle="tooltip" data-bs-placement="top"
                        title="View"><img src="icons/eye.svg" width="20" height="20"></button>
                </td>
            </tr>
            <tr>
                <td>03</td>
                <td>Rakibu Islam</td>
                <td>01703441845</td>
                <td>
                    <button type="button" class="btn btn-outline-primary" data-bs-toggle="tooltip"
                        data-bs-placement="top" title="Edit"><img src="icons/pencil.svg" width="20"
                            height="20"></button>
                    <button type="button" class="btn btn-outline-danger" data-bs-toggle="tooltip"
                        data-bs-placement="top" title="Delete">
                        <img src="icons/trash3.svg" width="20" height="20">
                    </button>
                    <button type="button" class="btn btn-outline-info" data-bs-toggle="tooltip" data-bs-placement="top"
                        title="View"><img src="icons/eye.svg" width="20" height="20"></button>
                </td>
            </tr>
        </tbody>
    </Table>
    <div class="modal fade" id="myModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <!-- <div class="modal-header">
                    <h5 class="modal-title">Modal Title</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div> -->

                <div class="modal-body">
                    <h1 class="text-center text-danger">Are You Sure !</h1>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-primary" title="Edit">Close</button>
                    <button class="btn btn-outline-danger" data-bs-dismiss="modal">Delete</button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        const tooltipTriggerList =
            document.querySelectorAll('[data-bs-toggle="tooltip"]')

        tooltipTriggerList.forEach(el => {
            new bootstrap.Tooltip(el)
        })
    </script>

</body>

</html>
