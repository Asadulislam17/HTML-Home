<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modal Form</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    .modal-header {
      background: linear-gradient(45deg, #0d6efd, #6610f2);
      color: white;
    }
    .modal-content {
      border-radius: 20px;
    }
    .modal.fade .modal-dialog {
      transform: scale(0.8);
      transition: transform 0.3s ease-in-out;
    }
    .modal.show .modal-dialog {
      transform: scale(1);
    }
  </style>
</head>

<body class="p-4 bg-light">

<button class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#formModal">
  <i class="bi bi-ui-checks"></i> Open Form
</button>
<button class="btn btn-primary" disabled>
  Disabled Button
</button>
<div class="btn btn-primary" aria-disabled="true">
  Fake Button
</div>

<div class="modal fade" id="formModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content shadow-lg">

  
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="bi bi-person-lines-fill"></i> User Form
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

     
      <div class="modal-body">
        <form>

          
          <div class="row">
            <div class="col-md-6 mb-3 form-floating">
              <input type="text" class="form-control" id="name" placeholder="Name">
              <label for="name">Full Name</label>
            </div>

            <div class="col-md-6 mb-3 form-floating">
              <input type="email" class="form-control" id="email" placeholder="Email">
              <label for="email">Email Address</label>
            </div>
          </div>

       
          <div class="form-floating mb-3">
            <textarea class="form-control" placeholder="Message" id="message" style="height:100px"></textarea>
            <label for="message">Message</label>
          </div>

         
          <div class="row">
            <div class="col-md-6 mb-3 form-floating">
              <input type="number" class="form-control" id="age" placeholder="Age">
              <label for="age">Age</label>
            </div>

            <div class="col-md-6 mb-3">
              <select class="form-select py-3">
                <option selected>Choose Option</option>
                <option>Option 1</option>
                <option>Option 2</option>
                <option>Option 3</option>
              </select>
            </div>
          </div>

         
          <div class="mb-3">
            <label class="form-label fw-bold">Gender</label><br>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender">
              <label class="form-check-label">Male</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender">
              <label class="form-check-label">Female</label>
            </div>
          </div>

          
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">
              I agree to the terms & conditions
            </label>
          </div>

          
          <div class="mb-4">
            <label class="form-label fw-bold">Upload File</label>
            <input type="file" class="form-control">
          </div>

          
          <div class="d-flex justify-content-end gap-2">
            <button type="submit" class="btn btn-success px-4">
              <i class="bi bi-check-circle"></i> Submit
            </button>
            <button type="reset" class="btn btn-outline-secondary px-4">
              Reset
            </button>
            <button type="button" class="btn btn-outline-danger px-4">
              Delete
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
