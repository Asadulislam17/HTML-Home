<!DOCTYPE html>
<html>
<head>
    <title>My first website</title>
    <style>
        body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        }
        .btnn{
            width: 100px;
            height: 40px;
            background: #ff7200;
            border: none;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            color: #fff;
            transition: 0.4s ease;
        }
        .btnn a{
            text-decoration: none;
            color: #000;
            font-weight: bold;
         }
    </style>
</head>

<body>
    <div style="text-align: center;">
        <h1 id="increment">0</h1>
        <button class="btnn" onclick="dec()">-</button>
        <button class="btnn" onclick="incre()">+</button>
        <button class="btnn" type="reset" onclick="reset()">Reset</button>
        
        
        
    </div>
    <script src="test.js"></script>
</body>

</html>
