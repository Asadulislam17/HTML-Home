    <script>

        var inc=document.getElementById("id1");
        var inc2=document.getElementById("id2");
        

        var fact=parseInt(prompt("Enter Your Number: "));
        var result=1;
        var output = ""; 
        if(fact<0){
           inc2.innerHTML = ("Factorial is not possiable!");
        }
        else{
            for(i=1; i<=fact; i++){
             output += i + " * " + result + " = " + (i * result) + "<br>";
            result=result*i;
            }
            // console.log(result);
            inc.innerHTML = output;
            inc2.innerHTML ="Factorial Value: "+result;
            
        }
