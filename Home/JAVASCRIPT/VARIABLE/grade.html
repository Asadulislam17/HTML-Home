<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade</title>
</head>
<body>
    <script>
        var num=prompt("Enter Your Number: ");
        if(num>=80){
            // console.log("A+");
            document.write("A+");
        }
        else if(num>=70){
            // console.log("A");
            document.write("A");
        }
        else if(num>=60){
            // console.log("B");
            document.write("B");
        }
        else{
            // console.log("Fail");
            document.write("Fail");
        }
    </script>
</body>
</html>
