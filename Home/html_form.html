<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details</title>
</head>
<body style="font-family: sans-serif; background-color: #f0f0f0; padding: 20px;">
    <div style="background-color: #fff; padding: 30px; border-radius: 8px; max-width: 400px; margin: auto;">
        <form>
            <h1>HTML Form</h1>
            <div style="margin-bottom: 15px; display: flex; align-items: center;">
                <label for="" style="flex: 1; margin-right: 10px;">First Name: </label>
                <input type="text" style="flex: 2; padding: 8px; border: 1px solid rgba(78, 77, 77, 0.884); border-radius: 4px; background-color: darkgrey;">
            </div>
            <div style="margin-bottom: 15px; display: flex; align-items: center;">
                <label for="" style="flex: 1; margin-right: 10px;">Last Name: </label>
                <input type="text" style="flex: 2; padding: 8px; border: 1px solid rgba(78, 77, 77, 0.884); border-radius: 4px; background-color: darkgrey;">
            </div>
            <div style="margin-bottom: 15px; display: flex; align-items: center;">
                <label for="" style="flex: 1; margin-right: 10px;">Date of Birth: </label>
                <input type="number" style="flex: 2; padding: 8px; border: 1px solid rgba(78, 77, 77, 0.884); border-radius: 4px; background-color: darkgrey;">
            </div>
            <div style="margin-bottom: 15px; display: flex; align-items: center;">
                <label for="" style="flex: 1; margin-right: 10px;">Email id: </label>
                <input type="email" style="flex: 2; padding: 8px; border: 1px solid rgba(78, 77, 77, 0.884); border-radius: 4px; background-color: darkgrey;">
            </div>
            <div style="margin-bottom: 15px; display: flex; align-items: center;">
                <label for="" style="flex: 1; margin-right: 10px;">Mobile Number: </label>
                <input type="text" style="flex: 2; padding: 8px; border: 1px solid rgba(78, 77, 77, 0.884); border-radius: 4px; background-color: darkgrey;">
            </div>
            <div style="margin-bottom: 15px; display: flex; align-items: center; ">
                <input type="submit" value="SUBMIT" style="background-color: darkgrey; color: black ; padding: 10px 20px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; border-radius: 4px;">

                <input type="reset" value="RESET" style="background-color: darkgrey; color: black; border-radius: 4px; padding: 10px 20px; margin: 5px; border: none; border-radius: 4px; cursor: pointer;" >
            </div>
        </form>
    </div>
</body>
</html>
