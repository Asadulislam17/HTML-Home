<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body style="font-family: sans-serif; background-color: #f0f0f0; padding: 20px;">
    <div style="background-color: #fff; padding: 30px; border-radius: 8px; max-width: 400px; margin: auto;">
        <form style="">
            <fieldset>
                <legend>Student Form</legend>
                <div style="padding-bottom: 10px;">
                    <label for="" style="flex: 1;">Name: </label>
                    <input type="text" style="flex: 2; align-items: center;">
                </div>
                <div style="padding-bottom: 10px;">
                    <label for="">Employee ID: </label>
                    <input type="number">
                </div>
                <div style="padding-bottom: 10px;">
                    <label for="">Email: </label>
                    <input type="email">
                </div>
                <div style="padding-bottom: 10px;">
                    <label for="" style="flex: 1;">Address: </label>
                    <textarea name="" id=""></textarea>
                </div>
                <div>
                    <label for="city">City: </label>
                    <select name="" id="">
                        <option value="">Dhaka</option>
                        <option value="">Rajshahi</option>
                        <option value="">CTG</option>
                    </select>
                </div>
                <fieldset>
                    <legend>Gender</legend>
                    <div style="padding-bottom: 10px;">
                    <input type="radio" value="Male" name="Gender">
                    <label for="">Male </label>
                    <input type="radio" value="Female" name="Gender">
                    <label for="">Female </label>
                    <input type="radio" value="others" name="Gender">
                    <label for="">others </label>
                </div>
                </fieldset>
                
                <div style="padding-bottom: 10px;">
                    <label for="">Subject: </label>
                    <input type="checkbox">HTML
                    <input type="checkbox">JAVA
                    <input type="checkbox">PHP
                </div>
                <div style="padding-bottom: 10px;">
                    <input type="submit" value="SUBMIT">
                    <input type="reset" value="RESET">
                    
                </div>
            </fieldset>
        </form>
    </div>
</body>
</html>
