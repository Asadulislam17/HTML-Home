<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table 5</title>
    <style>
        /* table, th, td {
            border: 3px solid navy; 
        } */
        .a{
            border-top: none;
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <table border="" style="border-collapse: collapse; width: 100%;">
            <tr>
                <th class="a">Srate of Health</th>
                <th colspan="2">Fasting Value</th>
                <th>After Eating</th>
            </tr>
            <tr>
                <td class="a"></td>
                <td class="b">Minimum</td>
                <td class="b">Maximum</td>
                <td class="b">2 hourd after eating</td>
            </tr>
            
            <tr>
                <td class="b">Healthy</td>
                <td class="b">70</td>
                <td class="b">100</td>
                <td class="b">Less than 140</td>
            </tr>
            
            <tr>
                <td>Pre-Diabetes</td>
                <td>101</td>
                <td>126</td>
                <td>140 to 200</td>
            </tr>
            <tr>
                <td>Diabetes</td>
                <td>More than 126</td>
                <td>N/A</td>
                <td>More than 200</td>
            </tr>
        </table>
    </div>
</body>
</html>
