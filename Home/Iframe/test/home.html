<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFrame</title>
    <style>
        .btnn{
            width: 150px;
            height: 40px;
            background: #ff7200;
            border: none;
            margin-top: 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            color: #fff;
            transition: 0.4s ease;
        }
        .btnn:hover{
            background: #fff;
            color: #ff7200;
        }
        .btnn a{
            text-decoration: none;
            color: #000;
            font-weight: bold;
         }
    </style>
</head>
<body>
    <h1>Home Page</h1>
    <div>
        <div style="width: 15%; height: 500px; float: left; background-color: #1e3d59;" >
            
            <div>
                <a href="index.html" target="iframe">
                    <button class="btnn">Table</button>
                </a>
            </div>

            <div>
                <a href="emp.html" target="iframe">
                    <button class="btnn" >Reg.</button>
                    </a>
            </div>
        </div>
        <div style="background-color:  #F8F9FA;">
            <iframe src="index.html" frameborder="0" name="iframe" width="85%" height="500px"></iframe>
        </div>
    </div>
</body>
</html>
