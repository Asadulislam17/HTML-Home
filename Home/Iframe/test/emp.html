<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details</title>
</head>
<body>
    <div>
        <form>
            <fieldset>
                <legend>Employee Details</legend>
                <div style="padding-bottom: 10px;">
                    <label for="" style="flex: 1;">id: </label>
                    <input type="text" style="flex: 2; align-items: center;">
                </div>
                <div style="padding-bottom: 10px;">
                    <label for="" style="flex: 1;">Name: </label>
                    <input type="text" style="flex: 2;">
                </div>
                <div style="padding-bottom: 10px;">
                    <input type="radio" value="Male" name="Gender">
                    <label for="">Male </label>
                    <input type="radio" value="Female" name="Gender">
                    <label for="">Female </label>
                </div>
                <div style="padding-bottom: 10px;">
                    <label for="">Round: </label>
                    <select name="" id="">
                        <option value="">70</option>
                        <option value="">71</option>
                        <option value="">72</option>
                        <option value="">73</option>
                    </select>
                </div>
                <div style="padding-bottom: 10px;">
                    <label for="">Education: </label>
                    <input type="checkbox"> SSC
                    <input type="checkbox"> HSC
                </div>
                
                <div style="padding-bottom: 10px;">
                    <input type="reset">
                    <input type="submit">
                </div>
            </fieldset>
        </form>
    </div>
</body>
</html>
